[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scar"
version = "0.1.0"
description = "State-Control-Action-Resource program graph compiler"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cpu = ["clang==18.1.8", "fparser==0.2.3"]
fortran = ["fparser==0.2.3"]
test = ["pytest>=8", "numpy==2.5.5", "matplotlib==3.11.2", "black==26.10.1"]

[project.scripts]
scar = "scar.cli:main"

[tool.setuptools.packages.find]
include = ["scar", "scar.*"]
namespaces = false

[tool.setuptools.package-data]
"scar.backend.cpp20" = ["runtime.hpp", "array.hpp", "host.hpp", "exceptions.hpp", "format.hpp", "text.hpp"]
"scar.backend.planning" = ["calibration.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests/stages"]

[tool.black]
line-length = 88
target-version = ["py310"]
