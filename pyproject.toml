[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scar"
version = "0.1.0"
description = "State-Control-Action-Resource program graph compiler"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fortran = ["fparser==0.2.3"]
test = ["pytest>=8", "numpy>=1.24"]

[project.scripts]
scar = "scar.cli:main"

[tool.setuptools.packages.find]
include = ["scar", "scar.*"]
namespaces = false

[tool.setuptools.package-data]
"scar.backend" = ["*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests/stages"]
