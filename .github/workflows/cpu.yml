name: Independent CPU stages and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14.7"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install compiler toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ gfortran make bear strace cmake binutils libclang1-18 clang-format-18 \
            libopenmpi-dev openmpi-bin libgmp-dev
          python -m pip install build
      - name: Provision pinned C++20 CPU array SDK
        run: |
          sdk_tools="$RUNNER_TEMP/scar-sdk-tools"
          python -m pip install --no-deps --target "$sdk_tools" cmake==3.31.6
          sdk_prefix="$RUNNER_TEMP/scar-sdk/xtensor-0.27.1"
          CMAKE_COMMAND="$sdk_tools/cmake/data/bin/cmake" python tools/provision_cpu_sdk.py --prefix "$sdk_prefix"
          echo "SCAR_CPU_SDK=$sdk_prefix" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$sdk_prefix${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          fft_prefix="$RUNNER_TEMP/scar-sdk/pocketfft-33ae5dc94c9cdc7f1c78346504a85de87cadaa12"
          python tools/provision_fft_sdk.py --prefix "$fft_prefix"
          echo "SCAR_FOURIER_SDK=$fft_prefix" >> "$GITHUB_ENV"
      - name: Build and install wheel
        run: |
          packages="$RUNNER_TEMP/scar-packages"
          python -m build --outdir "$packages"
          python -m venv "$RUNNER_TEMP/scar-verify"
          verify="$RUNNER_TEMP/scar-verify/bin/python"
          wheel=("$packages"/*.whl)
          python - "${wheel[0]}" <<'PY'
          from pathlib import Path
          import sys
          from zipfile import ZipFile

          sources = {
              p.as_posix(): p.read_bytes()
              for p in Path("scar").rglob("*")
              if p.suffix in {".py", ".cpp", ".hpp"}
          }
          with ZipFile(sys.argv[1]) as package:
              members = {
                  name
                  for name in package.namelist()
                  if name.startswith("scar/") and Path(name).suffix in {".py", ".cpp", ".hpp"}
              }
              if members != sources.keys():
                  raise SystemExit("wheel source members differ from the active source tree")
              if any(package.read(name) != data for name, data in sources.items()):
                  raise SystemExit("wheel contains stale source bytes")
          PY
          "$verify" -m pip install "${wheel[0]}[cpu,test]"
      - name: Verify source format
        run: |
          "$RUNNER_TEMP/scar-verify/bin/python" -m black --check scar tests tools
          find scar -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -exec clang-format-18 --dry-run --Werror --style=file {} +
      - name: Verify isolated stages from installed wheel
        run: |
          verify="$RUNNER_TEMP/scar-verify/bin/python"
          cd "$RUNNER_TEMP"
          "$verify" -m scar --help
          "$verify" -m pytest --import-mode=importlib -q --maxfail=1 "$GITHUB_WORKSPACE/tests/stages" \
            --basetemp="$RUNNER_TEMP/scar-stages" \
            --junitxml="$RUNNER_TEMP/scar-gates.xml"
          "$verify" - "$RUNNER_TEMP/scar-gates.xml" <<'PY'
          import sys
          from xml.etree import ElementTree

          report = ElementTree.parse(sys.argv[1])
          if any(int(suite.get("skipped", 0)) for suite in report.iter("testsuite")):
              raise SystemExit("CPU stage gates require the complete toolchain")
          PY
          find "$RUNNER_TEMP/scar-stages" -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -path '*/delivery/project/*' ! -path '*/project/vendor/*' \
            -exec clang-format-18 --dry-run --Werror --style=file {} +
          tar -czf "$RUNNER_TEMP/scar-mixed-stages.tar.gz" \
            -C "$RUNNER_TEMP/scar-stages/test_locked_mixed_target_three0" \
            hidden-frontend relocated-plan delivery
      - name: Upload packages and stage results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scar-cpu-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/scar-packages/*
            ${{ runner.temp }}/scar-gates.xml
            ${{ runner.temp }}/scar-mixed-stages.tar.gz
