name: Independent CPU stages and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14.7"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install compiler toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ gfortran make bear strace cmake binutils libclang1-18 clang-format-18 \
            libopenmpi-dev openmpi-bin libgmp-dev
          python -m pip install build
      - name: Provision pinned C++20 CPU array SDK
        run: |
          sdk_tools="$RUNNER_TEMP/scar-sdk-tools"
          python -m pip install --no-deps --target "$sdk_tools" cmake==3.31.6
          sdk_prefix="$RUNNER_TEMP/scar-sdk/xtensor-0.27.1"
          CMAKE_COMMAND="$sdk_tools/cmake/data/bin/cmake" python tools/provision_cpu_sdk.py --prefix "$sdk_prefix"
          echo "SCAR_CPU_SDK=$sdk_prefix" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$sdk_prefix${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          fft_prefix="$RUNNER_TEMP/scar-sdk/pocketfft-33ae5dc94c9cdc7f1c78346504a85de87cadaa12"
          python tools/provision_fft_sdk.py --prefix "$fft_prefix"
          echo "SCAR_FOURIER_SDK=$fft_prefix" >> "$GITHUB_ENV"
      - name: Build and install wheel
        run: |
          packages="$RUNNER_TEMP/scar-packages"
          python -m build --outdir "$packages"
          python -m venv "$RUNNER_TEMP/scar-verify"
          verify="$RUNNER_TEMP/scar-verify/bin/python"
          wheel=("$packages"/*.whl)
          python - "${wheel[0]}" <<'PY'
          from pathlib import Path
          import sys
          from zipfile import ZipFile

          sources = {
              p.as_posix(): p.read_bytes()
              for p in Path("scar").rglob("*")
              if p.suffix in {".py", ".cpp", ".hpp"}
          }
          with ZipFile(sys.argv[1]) as package:
              members = {
                  name
                  for name in package.namelist()
                  if name.startswith("scar/") and Path(name).suffix in {".py", ".cpp", ".hpp"}
              }
              if members != sources.keys():
                  raise SystemExit("wheel source members differ from the active source tree")
              if any(package.read(name) != data for name, data in sources.items()):
                  raise SystemExit("wheel contains stale source bytes")
          PY
          "$verify" -m pip install "${wheel[0]}[cpu,test]"
      - name: Verify source format
        run: |
          "$RUNNER_TEMP/scar-verify/bin/python" -m black --check scar tests tools
          find scar tests -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -exec clang-format-18 --dry-run --Werror --style=file {} +
      - name: Verify each CPU stage suite from the installed wheel
        id: stages
        run: |
          verify="$RUNNER_TEMP/scar-verify/bin/python"
          cd "$RUNNER_TEMP"
          "$verify" -m scar --help
          mkdir -p scar-gates scar-stages
          result=0
          for file in "$GITHUB_WORKSPACE"/tests/stages/test_*.py; do
            suite=$(basename "$file" .py)
            echo "::group::$suite"
            "$verify" -m pytest --import-mode=importlib -p no:cacheprovider -q "$file" \
              --basetemp="$RUNNER_TEMP/scar-stages/$suite" \
              --junitxml="$RUNNER_TEMP/scar-gates/$suite.xml" || result=1
            echo "::endgroup::"
          done
          "$verify" - <<'PYTHON'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          suites = sorted((Path(os.environ["GITHUB_WORKSPACE"]) / "tests/stages").glob("test_*.py"))
          if not suites:
              raise SystemExit("no CPU stage suites found")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print("| Suite | Tests | Failures | Errors | Skips |", file=summary)
              print("| --- | ---: | ---: | ---: | ---: |", file=summary)
              complete = True
              for suite in suites:
                  path = Path("scar-gates") / (suite.stem + ".xml")
                  rows = list(ElementTree.parse(path).iter("testsuite")) if path.exists() else []
                  counts = [sum(int(row.get(k, 0)) for row in rows) for k in ("tests", "failures", "errors", "skipped")]
                  print("|", suite.stem, "|", " | ".join(map(str, counts)), "|", file=summary)
                  complete &= counts[0] > 0 and not any(counts[1:])
          if not complete:
              raise SystemExit("one or more CPU stage suites were missing, failed or skipped")
          PYTHON
          exit "$result"
      - name: Check generated source and collect the mixed CPU project
        if: ${{ !cancelled() && (steps.stages.outcome == 'success' || steps.stages.outcome == 'failure') }}
        run: |
          find "$RUNNER_TEMP/scar-stages" -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            \( -path '*/delivery/project/*' -o -path '*/source-frames/project/*' \) ! -path '*/project/vendor/*' \
            -exec clang-format-18 --dry-run --Werror --style=file {} +
          root="$RUNNER_TEMP/scar-stages/test_compiler"
          for trial in "$root"/test_locked_mixed_target_three[0-9]*; do
            suffix=${trial##*three}
            archive=scar-mixed-stages
            if [[ "$suffix" != 0 ]]; then archive="$archive-$suffix"; fi
            tar -czf "$RUNNER_TEMP/$archive.tar.gz" -C "$trial" hidden-frontend relocated-plan delivery
          done
      - name: Upload packages and stage results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scar-cpu-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/scar-packages/*
            ${{ runner.temp }}/scar-gates/*.xml
            ${{ runner.temp }}/scar-mixed-stages*.tar.gz
